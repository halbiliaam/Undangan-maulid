<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital Maulidurrosul IAAM</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
          Users, UserCheck, UserX, Clock, Calendar, MapPin, Phone, Search, 
          Download, Edit, Trash2, Eye, Volume2, VolumeX, Heart, Share2, 
          MessageSquare, ShieldCheck, CheckCircle2, AlertCircle, X, Plus, Minus,
          ChevronRight, Compass, Sparkles, Send, Lock, LogOut, Check, RefreshCw
        } = lucide;

        function App() {
          const [currentView, setCurrentView] = useState('register'); // 'register', 'invitation', 'admin-login', 'admin-dashboard'
          const [guestData, setGuestData] = useState({
            name: '',
            phone: '',
            attendance: 'Hadir',
            guestsCount: 1,
            wishes: ''
          });
          const [registeredGuest, setRegisteredGuest] = useState(null);
          const [showDuplicateModal, setShowDuplicateModal] = useState(false);
          const [existingGuestMatch, setExistingGuestMatch] = useState(null);
          
          // Audio state
          const [isPlayingAudio, setIsPlayingAudio] = useState(false);
          const audioRef = useRef(null);

          // Admin state
          const [adminPin, setAdminPin] = useState('');
          const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
          const [adminTab, setAdminTab] = useState('guests'); // 'guests', 'settings', 'wishes'
          const [searchTerm, setSearchTerm] = useState('');
          const [filterAttendance, setFilterAttendance] = useState('All');
          const [selectedGuestDetail, setSelectedGuestDetail] = useState(null);

          // Mock Database state
          const [guestsList, setGuestsList] = useState([
            { id: 'IAAM-001', name: 'Ahmad Fauzan', phone: '081234567890', attendance: 'Hadir', guestsCount: 2, timestamp: '2026-08-24 10:30', updateTime: '2026-08-24 10:30', opened: true },
            { id: 'IAAM-002', name: 'Muhammad Ali', phone: '081987654321', attendance: 'Tentatif', guestsCount: 1, timestamp: '2026-08-24 11:15', updateTime: '2026-08-24 11:15', opened: true },
            { id: 'IAAM-003', name: 'Siti Aminah', phone: '081211223344', attendance: 'Tidak Hadir', guestsCount: 1, timestamp: '2026-08-24 12:00', updateTime: '2026-08-24 12:00', opened: false },
          ]);

          const [wishesList, setWishesList] = useState([
            { id: 1, name: 'Ahmad Fauzan', message: 'Semoga acara Maulidurrosul berjalan lancar dan membawa keberkahan bagi kita semua.', time: 'Hari ini, 10:35' },
            { id: 2, name: 'Muhammad Ali', message: 'Mabruk alfa mabruk untuk keluarga besar IAAM. Semoga ukhuwah terus terjaga.', time: 'Hari ini, 11:20' }
          ]);

          const [newEventWish, setNewEventWish] = useState({ name: '', message: '' });

          // Event Settings state
          const [eventSettings, setEventSettings] = useState({
            eventName: 'MAULIDURROSUL ﷺ',
            themeText: 'Meneladani Akhlak Rasulullah ﷺ, Mempererat Ukhuwah Alumni dan Keluarga Besar Al-Falahul Makkiyah Majidiyah',
            eventDate: 'Rabu, 18 September 2026',
            eventTime: '19:30 (Ba\'da Isya) - Selesai',
            locationName: 'Gedung Serbaguna Al-Falahul Makkiyah',
            locationAddress: 'Jl. Pesantren No. 45, Majapahit, Jawa Timur',
            mapsUrl: 'https://maps.google.com',
            whatsappContact: '628123456789',
            countdownTarget: '2026-09-18T19:30:00'
          });

          // Countdown timer state
          const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

          useEffect(() => {
            const target = new Date(eventSettings.countdownTarget).getTime();
            const interval = setInterval(() => {
              const now = new Date().getTime();
              const difference = target - now;

              if (difference > 0) {
                setTimeLeft({
                  days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                  hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                  minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
                  seconds: Math.floor((difference % (1000 * 60)) / 1000),
                });
              }
            }, 1000);
            return () => clearInterval(interval);
          }, [eventSettings.countdownTarget]);

          const toggleAudio = () => {
            if (!audioRef.current) return;
            if (isPlayingAudio) {
              audioRef.current.pause();
              setIsPlayingAudio(false);
            } else {
              audioRef.current.play().then(() => {
                setIsPlayingAudio(true);
              }).catch(e => console.log("Audio play blocked:", e));
            }
          };

          const handleRegisterSubmit = (e) => {
            e.preventDefault();
            if (!guestData.name.trim() || !guestData.phone.trim()) return;

            const existing = guestsList.find(g => g.phone === guestData.phone.trim());
            if (existing) {
              setExistingGuestMatch(existing);
              setShowDuplicateModal(true);
              return;
            }

            saveNewGuest(false);
          };

          const saveNewGuest = (isUpdate, existingId = null) => {
            const now = new Date().toISOString().replace('T', ' ').substring(0, 16);
            if (isUpdate && existingId) {
              const updatedList = guestsList.map(g => {
                if (g.id === existingId) {
                  return {
                    ...g,
                    name: guestData.name,
                    attendance: guestData.attendance,
                    guestsCount: guestData.guestsCount,
                    updateTime: now,
                    opened: true
                  };
                }
                return g;
              });
              setGuestsList(updatedList);
              const updatedObj = updatedList.find(g => g.id === existingId);
              setRegisteredGuest(updatedObj);
            } else {
              const newId = `IAAM-${String(guestsList.length + 1).padStart(3, '0')}`;
              const newGuestObj = {
                id: newId,
                name: guestData.name,
                phone: guestData.phone.trim(),
                attendance: guestData.attendance,
                guestsCount: guestData.guestsCount,
                timestamp: now,
                updateTime: now,
                opened: true
              };
              setGuestsList([newGuestObj, ...guestsList]);
              setRegisteredGuest(newGuestObj);
            }

            if (guestData.wishes.trim()) {
              setWishesList([
                { id: Date.now(), name: guestData.name, message: guestData.wishes, time: 'Baru saja' },
                ...wishesList
              ]);
            }

            setShowDuplicateModal(false);
            setCurrentView('invitation');
            setNewEventWish(prev => ({ ...prev, name: guestData.name }));
          };

          const handleUpdateConfirmation = (e) => {
            e.preventDefault();
            if (!registeredGuest) return;
            const now = new Date().toISOString().replace('T', ' ').substring(0, 16);
            const updated = guestsList.map(g => {
              if (g.id === registeredGuest.id) {
                return {
                  ...g,
                  attendance: registeredGuest.attendance,
                  guestsCount: registeredGuest.guestsCount,
                  updateTime: now
                };
              }
              return g;
            });
            setGuestsList(updated);
            alert('Konfirmasi kehadiran berhasil diperbarui!');
          };

          const handleSendWish = (e) => {
            e.preventDefault();
            if (!newEventWish.name.trim() || !newEventWish.message.trim()) return;
            setWishesList([
              { id: Date.now(), name: newEventWish.name, message: newEventWish.message, time: 'Baru saja' },
              ...wishesList
            ]);
            setNewEventWish({ name: registeredGuest ? registeredGuest.name : '', message: '' });
            alert('Ucapan dan doa berhasil dikirim!');
          };

          const handleAdminLogin = (e) => {
            e.preventDefault();
            if (adminPin === '123456' || adminPin === 'admin') {
              setIsAdminAuthenticated(true);
              setCurrentView('admin-dashboard');
              setAdminPin('');
            } else {
              alert('PIN atau Password salah! (Gunakan: 123456)');
            }
          };

          const exportToExcel = (filterType = 'All') => {
            let dataToExport = guestsList;
            if (filterType === 'Hadir') dataToExport = guestsList.filter(g => g.attendance === 'Hadir');
            if (filterType === 'Tidak Hadir') dataToExport = guestsList.filter(g => g.attendance === 'Tidak Hadir');
            if (filterType === 'Tentatif') dataToExport = guestsList.filter(g => g.attendance === 'Tentatif');

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID,Nama Lengkap,No Telepon,Status Kehadiran,Jumlah Tamu,Waktu Daftar,Update Terakhir\n";

            dataToExport.forEach(row => {
              csvContent += `"${row.id}","${row.name}","${row.phone}","${row.attendance}","${row.guestsCount}","${row.timestamp}","${row.updateTime}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Daftar_Tamu_Maulidurrosul_IAAM_${filterType}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const filteredGuests = guestsList.filter(guest => {
            const matchesSearch = guest.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  guest.phone.includes(searchTerm);
            const matchesFilter = filterAttendance === 'All' || guest.attendance === filterAttendance;
            return matchesSearch && matchesFilter;
          });

          const totalGuests = guestsList.length;
          const countHadir = guestsList.filter(g => g.attendance === 'Hadir').length;
          const countTidakHadir = guestsList.filter(g => g.attendance === 'Tidak Hadir').length;
          const countTentatif = guestsList.filter(g => g.attendance === 'Tentatif').length;
          const totalOrangHadir = guestsList.filter(g => g.attendance === 'Hadir').reduce((acc, curr) => acc + curr.guestsCount, 0);

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-emerald-600 selection:text-white">
              <audio ref={audioRef} loop src="https://actions.google.com/sounds/v1/ambiences/islamic_meditation_bells.ogg" />

              {currentView === 'invitation' && (
                <button 
                  onClick={toggleAudio}
                  className="fixed bottom-6 right-6 z-50 bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-full shadow-2xl flex items-center justify-center transition-all animate-bounce border-2 border-amber-400"
                  title="Putar/Matikan Musik Islami"
                >
                  {isPlayingAudio ? <Volume2 size={24} /> : <VolumeX size={24} />}
                </button>
              )}

              {/* VIEW 1: REGISTRATION GATE */}
              {currentView === 'register' && (
                <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950 via-slate-950 to-black relative overflow-hidden">
                  <div className="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-emerald-500/30 rounded-2xl shadow-2xl p-6 sm:p-8 relative z-10">
                    <div className="text-center mb-6">
                      <div className="w-20 h-20 mx-auto mb-4 bg-emerald-900/50 border-2 border-amber-400/80 rounded-full flex items-center justify-center shadow-lg">
                        <span className="text-2xl font-bold text-amber-400 tracking-wider">IAAM</span>
                      </div>
                      <span className="text-xs uppercase tracking-widest text-emerald-400 font-semibold">Ikatan Alumni Al-Falahul Makkiyah</span>
                      <h1 className="text-2xl sm:text-3xl font-bold text-white mt-1">MAULIDURROSUL ﷺ</h1>
                      <div className="w-16 h-1 bg-amber-400 mx-auto mt-2 rounded-full"></div>
                    </div>

                    <div className="bg-emerald-950/60 border border-emerald-800/50 rounded-xl p-4 mb-6 text-sm text-emerald-100/90 leading-relaxed text-center">
                      <p className="font-semibold text-amber-300 mb-1">Assalamu'alaikum Warahmatullahi Wabarakatuh</p>
                      <p>Silakan isi data diri terlebih dahulu untuk membuka undangan digital dan konfirmasi kehadiran Anda.</p>
                    </div>

                    <form onSubmit={handleRegisterSubmit} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nama Lengkap & Gelar *</label>
                        <input 
                          type="text" 
                          required
                          placeholder="Contoh: Ahmad Fauzan, S.Pd."
                          value={guestData.name}
                          onChange={(e) => setGuestData({...guestData, name: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nomor Telepon / WhatsApp *</label>
                        <input 
                          type="tel" 
                          required
                          placeholder="Contoh: 081234567890"
                          value={guestData.phone}
                          onChange={(e) => setGuestData({...guestData, phone: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Konfirmasi Kehadiran *</label>
                        <div className="grid grid-cols-3 gap-2">
                          {['Hadir', 'Tidak Hadir', 'Tentatif'].map((status) => (
                            <button
                              type="button"
                              key={status}
                              onClick={() => setGuestData({...guestData, attendance: status})}
                              className={`py-2 px-2 text-xs sm:text-sm font-medium rounded-lg border transition-all ${
                                guestData.attendance === status 
                                  ? 'bg-emerald-600 border-amber-400 text-white shadow-lg' 
                                  : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-600'
                              }`}
                            >
                              {status}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Jumlah Orang yang Hadir</label>
                        <div className="flex items-center space-x-3 bg-slate-950 border border-slate-700 rounded-lg p-2">
                          <button 
                            type="button"
                            onClick={() => setGuestData({...guestData, guestsCount: Math.max(1, guestData.guestsCount - 1)})}
                            className="w-8 h-8 bg-slate-800 rounded-md flex items-center justify-center text-amber-400 font-bold"
                          >
                            -
                          </button>
                          <span className="flex-1 text-center font-bold text-lg text-white">{guestData.guestsCount} Orang</span>
                          <button 
                            type="button"
                            onClick={() => setGuestData({...guestData, guestsCount: guestData.guestsCount + 1})}
                            className="w-8 h-8 bg-slate-800 rounded-md flex items-center justify-center text-amber-400 font-bold"
                          >
                            +
                          </button>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Ucapan / Doa Singkat (Opsional)</label>
                        <textarea 
                          rows="2"
                          placeholder="Tuliskan ucapan atau doa untuk acara..."
                          value={guestData.wishes}
                          onChange={(e) => setGuestData({...guestData, wishes: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 text-sm resize-none"
                        ></textarea>
                      </div>

                      <button 
                        type="submit"
                        className="w-full mt-2 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-amber-200 font-bold py-3.5 px-6 rounded-xl shadow-xl border border-amber-400/50 flex items-center justify-center space-x-2 transition-all"
                      >
                        <span>BUKA UNDANGAN</span>
                        <ChevronRight size={18} />
                      </button>
                    </form>

                    <div className="mt-6 pt-4 border-t border-slate-800 text-center">
                      <button 
                        onClick={() => setCurrentView('admin-login')}
                        className="text-xs text-slate-400 hover:text-amber-400 transition-colors inline-flex items-center space-x-1"
                      >
                        <Lock size={12} />
                        <span>Masuk ke Dashboard Admin</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Duplicate Modal */}
              {showDuplicateModal && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-amber-400/40 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-3">
                      <AlertCircle size={24} />
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">Nomor Sudah Terdaftar</h3>
                    <p className="text-xs text-slate-300 mb-4">
                      Nomor WhatsApp <span className="text-amber-300 font-semibold">{guestData.phone}</span> sudah terdaftar atas nama <span className="text-emerald-400 font-semibold">{existingGuestMatch?.name}</span>. Apakah Anda ingin memperbarui data sebelumnya?
                    </p>
                    <div className="grid grid-cols-2 gap-3">
                      <button 
                        onClick={() => setShowDuplicateModal(false)}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-sm"
                      >
                        Batal
                      </button>
                      <button 
                        onClick={() => saveNewGuest(true, existingGuestMatch.id)}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-sm shadow-lg"
                      >
                        Perbarui Data
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 2: INVITATION */}
              {currentView === 'invitation' && (
                <div className="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden">
                  <section className="relative min-h-screen flex flex-col items-center justify-center text-center p-6 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-900 via-slate-950 to-black border-b border-emerald-900/50">
                    <div className="relative z-10 max-w-xl mx-auto space-y-6">
                      <div className="w-24 h-24 mx-auto bg-emerald-950/80 border-2 border-amber-400 rounded-full flex items-center justify-center shadow-2xl">
                        <span className="text-3xl font-extrabold text-amber-400">IAAM</span>
                      </div>

                      <div>
                        <span className="text-xs sm:text-sm font-semibold tracking-widest text-emerald-400 uppercase">Ikatan Alumni Al-Falahul Makkiyah Majidiyah</span>
                        <h1 className="text-4xl sm:text-6xl font-black text-white mt-2 tracking-wide font-serif">MAULIDURROSUL ﷺ</h1>
                        <p className="text-amber-300/90 italic text-sm sm:text-base mt-2 px-4">"{eventSettings.themeText}"</p>
                      </div>

                      <div className="bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-6 backdrop-blur-md shadow-2xl max-w-md mx-auto">
                        <p className="text-xs uppercase tracking-widest text-slate-400 mb-1">Undangan Khusus Kepada Yth.</p>
                        <h2 className="text-2xl font-bold text-amber-400 mb-2">{registeredGuest ? registeredGuest.name : guestData.name}</h2>
                        <div className="inline-block bg-emerald-950 border border-emerald-700/50 px-3 py-1 rounded-full text-xs text-emerald-300 mb-4">
                          Status: <span className="font-bold text-amber-300">{registeredGuest ? registeredGuest.attendance : guestData.attendance}</span>
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">
                          Dengan penuh rasa syukur dan kebahagiaan, kami mengundang Bapak/Ibu/Saudara/i untuk hadir dalam acara Maulidurrosul ﷺ.
                        </p>
                      </div>

                      <div className="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
                        <a 
                          href="#detail-acara"
                          className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg border border-amber-400/50 flex items-center space-x-2 transition-all"
                        >
                          <Sparkles size={18} className="text-amber-300" />
                          <span>Lihat Detail Acara</span>
                        </a>
                      </div>
                    </div>
                  </section>

                  <section className="py-16 px-6 max-w-3xl mx-auto text-center space-y-6">
                    <h3 className="text-amber-400 font-serif text-2xl font-bold">Bismillahirrahmanirrahim</h3>
                    <p className="text-lg text-emerald-200 font-medium">Assalamu'alaikum Warahmatullahi Wabarakatuh</p>
                    <p className="text-slate-300 leading-relaxed text-sm sm:text-base">
                      Dengan memohon rahmat dan ridha Allah SWT, kami segenap keluarga besar <strong className="text-white">IAAM (Ikatan Alumni Al-Falahul Makkiyah Majidiyah)</strong> mengundang Bapak/Ibu/Saudara/i untuk menghadiri peringatan Maulid Nabi Besar Muhammad ﷺ.
                    </p>

                    <div className="bg-gradient-to-br from-emerald-950 to-slate-900 border border-emerald-500/40 rounded-2xl p-6 shadow-2xl my-8">
                      <h4 className="text-xs uppercase tracking-widest text-amber-400 font-bold mb-4">Menuju Acara Utama</h4>
                      <div className="grid grid-cols-4 gap-2 sm:gap-4 max-w-md mx-auto text-center">
                        <div className="bg-slate-950/80 border border-emerald-800 rounded-xl p-3">
                          <div className="text-2xl sm:text-3xl font-black text-amber-400">{timeLeft.days}</div>
                          <div className="text-[10px] sm:text-xs text-slate-400 uppercase mt-1">Hari</div>
                        </div>
                        <div className="bg-slate-950/80 border border-emerald-800 rounded-xl p-3">
                          <div className="text-2xl sm:text-3xl font-black text-amber-400">{timeLeft.hours}</div>
                          <div className="text-[10px] sm:text-xs text-slate-400 uppercase mt-1">Jam</div>
                        </div>
                        <div className="bg-slate-950/80 border border-emerald-800 rounded-xl p-3">
                          <div className="text-2xl sm:text-3xl font-black text-amber-400">{timeLeft.minutes}</div>
                          <div className="text-[10px] sm:text-xs text-slate-400 uppercase mt-1">Menit</div>
                        </div>
                        <div className="bg-slate-950/80 border border-emerald-800 rounded-xl p-3">
                          <div className="text-2xl sm:text-3xl font-black text-amber-400">{timeLeft.seconds}</div>
                          <div className="text-[10px] sm:text-xs text-slate-400 uppercase mt-1">Detik</div>
                        </div>
                      </div>
                    </div>
                  </section>

                  <section id="detail-acara" className="py-16 px-6 bg-slate-900/50 border-y border-emerald-900/40">
                    <div className="max-w-4xl mx-auto">
                      <div className="text-center mb-12">
                        <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">Waktu & Tempat</span>
                        <h3 className="text-3xl font-bold text-white mt-1">Detail Pelaksanaan</h3>
                        <div className="w-16 h-1 bg-amber-400 mx-auto mt-2 rounded-full"></div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 text-center shadow-xl">
                          <div className="w-12 h-12 bg-emerald-950 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Calendar size={24} />
                          </div>
                          <h4 className="font-bold text-white mb-1">Hari & Tanggal</h4>
                          <p className="text-sm text-emerald-200">{eventSettings.eventDate}</p>
                        </div>
                        <div className="bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 text-center shadow-xl">
                          <div className="w-12 h-12 bg-emerald-950 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Clock size={24} />
                          </div>
                          <h4 className="font-bold text-white mb-1">Waktu</h4>
                          <p className="text-sm text-emerald-200">{eventSettings.eventTime}</p>
                        </div>
                        <div className="bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 text-center shadow-xl">
                          <div className="w-12 h-12 bg-emerald-950 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4">
                            <MapPin size={24} />
                          </div>
                          <h4 className="font-bold text-white mb-1">Lokasi</h4>
                          <p className="text-sm text-emerald-200 mb-3">{eventSettings.locationName}<br/>{eventSettings.locationAddress}</p>
                          <a href="https://maps.google.com" target="_blank" rel="noreferrer" className="inline-block bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-4 rounded-lg shadow">
                            Buka Google Maps
                          </a>
                        </div>
                      </div>
                    </div>
                  </section>

                  <section className="py-16 px-6 max-w-3xl mx-auto">
                    <div className="text-center mb-12">
                      <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">Susunan Acara</span>
                      <h3 className="text-3xl font-bold text-white mt-1">Rangkaian Kegiatan</h3>
                      <div className="w-16 h-1 bg-amber-400 mx-auto mt-2 rounded-full"></div>
                    </div>

                    <div className="space-y-4 relative before:absolute before:inset-0 before:left-7 before:w-0.5 before:bg-emerald-800">
                      {[
                        { time: '19:30', title: 'Registrasi & Penyambutan Tamu Undangan', desc: 'Pengisian daftar hadir digital.' },
                        { time: '20:00', title: 'Pembukaan', desc: 'Pembacaan ayat suci Al-Qur\'an.' },
                        { time: '20:30', title: 'Pembacaan Shalawat & Maulid', desc: 'Dipimpin oleh Tim Hadrah IAAM.' },
                        { time: '21:15', title: 'Sambutan-sambutan', desc: 'Ketua Umum IAAM & Pengasuh Pondok Pesantren.' },
                        { time: '21:45', title: 'Ceramah / Tausiyah Utama', desc: 'Disampaikan oleh Al-Ustadz / Kiai.' },
                        { time: '22:30', title: 'Do\'a Penutup & Ramah Tamah', desc: 'Selesai.' },
                      ].map((item, index) => (
                        <div key={index} className="flex items-start space-x-4 relative bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow">
                          <div className="w-14 h-14 bg-emerald-950 border border-amber-400 text-amber-400 font-bold text-xs rounded-full flex items-center justify-center shrink-0 z-10 shadow">
                            {item.time}
                          </div>
                          <div>
                            <h4 className="font-bold text-white text-base">{item.title}</h4>
                            <p className="text-xs text-slate-400 mt-1">{item.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>

                  <section className="py-16 px-6 bg-slate-900/50 border-t border-emerald-900/40">
                    <div className="max-w-md mx-auto bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 sm:p-8 shadow-2xl">
                      <div className="text-center mb-6">
                        <h3 className="text-xl font-bold text-white">Konfirmasi Kehadiran</h3>
                        <p className="text-xs text-slate-400 mt-1">Ubah atau perbarui status kehadiran Anda</p>
                      </div>

                      {registeredGuest ? (
                        <form onSubmit={handleUpdateConfirmation} className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nama Lengkap</label>
                            <input type="text" disabled value={registeredGuest.name} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-400 text-sm" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nomor WhatsApp</label>
                            <input type="text" disabled value={registeredGuest.phone} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-400 text-sm" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Status Kehadiran</label>
                            <div className="grid grid-cols-3 gap-2">
                              {['Hadir', 'Tidak Hadir', 'Tentatif'].map((status) => (
                                <button
                                  type="button"
                                  key={status}
                                  onClick={() => setRegisteredGuest({...registeredGuest, attendance: status})}
                                  className={`py-2 px-1 text-xs font-medium rounded-lg border transition-all ${
                                    registeredGuest.attendance === status ? 'bg-emerald-600 border-amber-400 text-white shadow' : 'bg-slate-950 border-slate-800 text-slate-400'
                                  }`}
                                >
                                  {status}
                                </button>
                              ))}
                            </div>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Jumlah Tamu</label>
                            <div className="flex items-center space-x-3 bg-slate-950 border border-slate-700 rounded-lg p-2">
                              <button type="button" onClick={() => setRegisteredGuest({...registeredGuest, guestsCount: Math.max(1, registeredGuest.guestsCount - 1)})} className="w-8 h-8 bg-slate-800 rounded-md flex items-center justify-center text-amber-400 font-bold">-</button>
                              <span className="flex-1 text-center font-bold text-white">{registeredGuest.guestsCount} Orang</span>
                              <button type="button" onClick={() => setRegisteredGuest({...registeredGuest, guestsCount: registeredGuest.guestsCount + 1})} className="w-8 h-8 bg-slate-800 rounded-md flex items-center justify-center text-amber-400 font-bold">+</button>
                            </div>
                          </div>
                          <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all text-sm">Simpan Perubahan</button>
                        </form>
                      ) : (
                        <p className="text-center text-sm text-slate-400">Silakan isi data terlebih dahulu di halaman awal.</p>
                      )}
                    </div>
                  </section>

                  <section className="py-16 px-6 max-w-3xl mx-auto">
                    <div className="text-center mb-10">
                      <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">Buku Tamu Digital</span>
                      <h3 className="text-3xl font-bold text-white mt-1">Ucapan & Doa</h3>
                      <div className="w-16 h-1 bg-amber-400 mx-auto mt-2 rounded-full"></div>
                    </div>

                    <div className="bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 mb-8 shadow-xl">
                      <form onSubmit={handleSendWish} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nama</label>
                          <input type="text" required placeholder="Nama Anda" value={newEventWish.name} onChange={(e) => setNewEventWish({...newEventWish, name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Pesan & Doa</label>
                          <textarea rows="3" required placeholder="Tulis ucapan atau doa..." value={newEventWish.message} onChange={(e) => setNewEventWish({...newEventWish, message: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm resize-none"></textarea>
                        </div>
                        <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-6 rounded-xl text-sm shadow flex items-center space-x-2">
                          <Send size={16} />
                          <span>Kirim Ucapan</span>
                        </button>
                      </form>
                    </div>

                    <div className="space-y-4 max-h-96 overflow-y-auto pr-2">
                      {wishesList.map((wish) => (
                        <div key={wish.id} className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 shadow">
                          <div className="flex items-center justify-between mb-1">
                            <h5 className="font-bold text-amber-400 text-sm">{wish.name}</h5>
                            <span className="text-[10px] text-slate-500">{wish.time}</span>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">{wish.message}</p>
                        </div>
                      ))}
                    </div>
                  </section>

                  <footer className="py-8 bg-slate-950 border-t border-emerald-950 text-center text-xs text-slate-500">
                    <p className="font-semibold text-emerald-400 mb-1">IAAM — Ikatan Alumni Al-Falahul Makkiyah Majidiyah</p>
                    <p>Digital Invitation System © 2026</p>
                  </footer>
                </div>
              )}

              {/* VIEW 3: ADMIN LOGIN */}
              {currentView === 'admin-login' && (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                  <div className="w-full max-w-sm bg-slate-900 border border-emerald-500/30 rounded-2xl p-8 shadow-2xl text-center">
                    <div className="w-16 h-16 bg-emerald-950 border border-amber-400 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                      <Lock size={28} />
                    </div>
                    <h2 className="text-xl font-bold text-white mb-1">Dashboard Admin</h2>
                    <p className="text-xs text-slate-400 mb-6">Masukkan PIN Akses Administrator (PIN: 123456)</p>

                    <form onSubmit={handleAdminLogin} className="space-y-4">
                      <input 
                        type="password" 
                        required
                        placeholder="Masukkan PIN"
                        value={adminPin}
                        onChange={(e) => setAdminPin(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-center tracking-widest text-lg placeholder-slate-600 focus:outline-none focus:border-amber-400"
                      />
                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all text-sm">Masuk Dashboard</button>
                      <button type="button" onClick={() => setCurrentView('register')} className="w-full text-xs text-slate-400 hover:text-white pt-2">Kembali ke Halaman Depan</button>
                    </form>
                  </div>
                </div>
              )}

              {/* VIEW 4: ADMIN DASHBOARD */}
              {currentView === 'admin-dashboard' && isAdminAuthenticated && (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                  <header className="bg-slate-900 border-b border-emerald-900/50 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div className="flex items-center space-x-3">
                      <div className="w-10 h-10 bg-emerald-950 border border-amber-400 rounded-full flex items-center justify-center text-amber-400 font-bold">IAAM</div>
                      <div>
                        <h1 className="font-bold text-white text-lg">Admin Panel Undangan</h1>
                        <p className="text-xs text-slate-400">Ikatan Alumni Al-Falahul Makkiyah Majidiyah</p>
                      </div>
                    </div>
                    <div className="flex items-center space-x-2">
                      <button onClick={() => exportToExcel('All')} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl flex items-center space-x-2 shadow">
                        <Download size={16} />
                        <span>Export Excel (.csv)</span>
                      </button>
                      <button onClick={() => { setIsAdminAuthenticated(false); setCurrentView('register'); }} className="bg-slate-800 hover:bg-slate-700 text-red-400 text-xs font-bold py-2.5 px-4 rounded-xl flex items-center space-x-1">
                        <LogOut size={16} />
                        <span>Keluar</span>
                      </button>
                    </div>
                  </header>

                  <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                        <span className="text-xs text-slate-400 font-semibold uppercase">Total Tamu</span>
                        <div className="text-2xl sm:text-3xl font-black text-white mt-1">{totalGuests}</div>
                      </div>
                      <div className="bg-slate-900 border border-emerald-900/60 rounded-2xl p-4 shadow-xl">
                        <span className="text-xs text-emerald-400 font-semibold uppercase">Hadir</span>
                        <div className="text-2xl sm:text-3xl font-black text-emerald-400 mt-1">{countHadir}</div>
                      </div>
                      <div className="bg-slate-900 border border-red-900/60 rounded-2xl p-4 shadow-xl">
                        <span className="text-xs text-red-400 font-semibold uppercase">Tidak Hadir</span>
                        <div className="text-2xl sm:text-3xl font-black text-red-400 mt-1">{countTidakHadir}</div>
                      </div>
                      <div className="bg-slate-900 border border-amber-900/60 rounded-2xl p-4 shadow-xl">
                        <span className="text-xs text-amber-400 font-semibold uppercase">Tentatif</span>
                        <div className="text-2xl sm:text-3xl font-black text-amber-400 mt-1">{countTentatif}</div>
                      </div>
                      <div className="col-span-2 md:col-span-1 bg-slate-900 border border-blue-900/60 rounded-2xl p-4 shadow-xl">
                        <span className="text-xs text-blue-400 font-semibold uppercase">Total Orang Hadir</span>
                        <div className="text-2xl sm:text-3xl font-black text-blue-400 mt-1">{totalOrangHadir}</div>
                      </div>
                    </div>

                    <div className="flex space-x-2 border-b border-slate-800 pb-2">
                      <button onClick={() => setAdminTab('guests')} className={`px-4 py-2 rounded-xl text-sm font-semibold ${adminTab === 'guests' ? 'bg-emerald-600 text-white' : 'text-slate-400 bg-slate-900'}`}>Daftar Tamu</button>
                      <button onClick={() => setAdminTab('settings')} className={`px-4 py-2 rounded-xl text-sm font-semibold ${adminTab === 'settings' ? 'bg-emerald-600 text-white' : 'text-slate-400 bg-slate-900'}`}>Pengaturan Acara</button>
                    </div>

                    {adminTab === 'guests' && (
                      <div className="space-y-4">
                        <div className="flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800">
                          <div className="relative w-full sm:w-72">
                            <Search size={18} className="absolute left-3 top-3 text-slate-500" />
                            <input 
                              type="text" 
                              placeholder="Cari nama atau no. telepon..."
                              value={searchTerm}
                              onChange={(e) => setSearchTerm(e.target.value)}
                              className="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-amber-400"
                            />
                          </div>
                          <div className="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto">
                            {['All', 'Hadir', 'Tidak Hadir', 'Tentatif'].map((status) => (
                              <button
                                key={status}
                                onClick={() => setFilterAttendance(status)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${
                                  filterAttendance === status ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-950 border border-slate-800 text-slate-400'
                                }`}
                              >
                                {status}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                          <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm">
                              <thead>
                                <tr className="bg-slate-950 text-slate-400 border-b border-slate-800 text-xs uppercase tracking-wider">
                                  <th className="p-4">No</th>
                                  <th className="p-4">Nama Tamu</th>
                                  <th className="p-4">No. Telepon</th>
                                  <th className="p-4">Kehadiran</th>
                                  <th className="p-4">Jumlah</th>
                                  <th className="p-4">Waktu Daftar</th>
                                  <th className="p-4 text-center">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {filteredGuests.length > 0 ? (
                                  filteredGuests.map((guest, index) => (
                                    <tr key={guest.id} className="hover:bg-slate-800/50">
                                      <td className="p-4 text-slate-400 font-mono text-xs">{index + 1}</td>
                                      <td className="p-4 font-bold text-white">{guest.name}</td>
                                      <td className="p-4 text-slate-300 font-mono text-xs">{guest.phone}</td>
                                      <td className="p-4">
                                        <span className={`inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${
                                          guest.attendance === 'Hadir' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                          guest.attendance === 'Tidak Hadir' ? 'bg-red-950 text-red-400 border border-red-800' :
                                          'bg-amber-950 text-amber-400 border border-amber-800'
                                        }`}>{guest.attendance}</span>
                                      </td>
                                      <td className="p-4 text-slate-300">{guest.guestsCount} Orang</td>
                                      <td className="p-4 text-slate-400 text-xs">{guest.timestamp}</td>
                                      <td className="p-4 text-center">
                                        <div className="flex items-center justify-center space-x-2">
                                          <button onClick={() => setSelectedGuestDetail(guest)} className="p-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg"><Eye size={16} /></button>
                                          <button onClick={() => { if (confirm(`Hapus tamu ${guest.name}?`)) setGuestsList(guestsList.filter(g => g.id !== guest.id)); }} className="p-1.5 bg-slate-800 hover:bg-red-900 text-red-400 rounded-lg"><Trash2 size={16} /></button>
                                        </div>
                                      </td>
                                    </tr>
                                  ))
                                ) : (
                                  <tr><td colSpan="7" className="p-8 text-center text-slate-500">Tidak ada data tamu.</td></tr>
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    )}

                    {adminTab === 'settings' && (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-2xl mx-auto shadow-xl">
                        <h3 className="text-xl font-bold text-white mb-4">Pengaturan Informasi Acara</h3>
                        <form onSubmit={(e) => { e.preventDefault(); alert('Pengaturan berhasil disimpan!'); }} className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nama Acara</label>
                            <input type="text" value={eventSettings.eventName} onChange={(e) => setEventSettings({...eventSettings, eventName: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Tema Acara</label>
                            <textarea rows="2" value={eventSettings.themeText} onChange={(e) => setEventSettings({...eventSettings, themeText: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm resize-none"></textarea>
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Tanggal Acara</label>
                              <input type="text" value={eventSettings.eventDate} onChange={(e) => setEventSettings({...eventSettings, eventDate: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm" />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Waktu Acara</label>
                              <input type="text" value={eventSettings.eventTime} onChange={(e) => setEventSettings({...eventSettings, eventTime: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm" />
                            </div>
                          </div>
                          <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow text-sm">Simpan Pengaturan</button>
                        </form>
                      </div>
                    )}
                  </main>

                  {selectedGuestDetail && (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                      <div className="bg-slate-900 border border-amber-400/40 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                          <h3 className="font-bold text-white text-lg">Detail Tamu Undangan</h3>
                          <button onClick={() => setSelectedGuestDetail(null)} className="text-slate-400 hover:text-white"><X size={20} /></button>
                        </div>
                        <div className="space-y-2 text-sm">
                          <p><span className="text-slate-400">ID:</span> <span className="text-amber-400 font-mono font-bold">{selectedGuestDetail.id}</span></p>
                          <p><span className="text-slate-400">Nama Lengkap:</span> <span className="text-white font-bold">{selectedGuestDetail.name}</span></p>
                          <p><span className="text-slate-400">No. Telepon / WA:</span> <span className="text-slate-200 font-mono">{selectedGuestDetail.phone}</span></p>
                          <p><span className="text-slate-400">Kehadiran:</span> <span className="text-emerald-400 font-bold">{selectedGuestDetail.attendance}</span></p>
                          <p><span className="text-slate-400">Jumlah Tamu:</span> <span className="text-slate-200">{selectedGuestDetail.guestsCount} Orang</span></p>
                          <p><span className="text-slate-400">Waktu Daftar:</span> <span className="text-slate-300 text-xs">{selectedGuestDetail.timestamp}</span></p>
                        </div>
                        <button onClick={() => setSelectedGuestDetail(null)} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm">Tutup</button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
