<body class="bg-ivory-pattern text-slate-800 antialiased selection:bg-emerald-600 selection:text-white">

    <!-- JAVASCRIPT APLIKASI UTAMA -->
    <script>
        let supabaseUrl = localStorage.getItem('sb_url') || 'https://your-supabase-project.supabase.co';
        let supabaseKey = localStorage.getItem('sb_key') || 'your-anon-key';
        let supabaseClient = null;

        try {
            if (supabaseUrl && supabaseKey && supabaseUrl.startsWith('http')) {
                supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
            }
        } catch(e) {}

        let currentRoute = window.location.hash.slice(1) || '/';
        let currentUserData = JSON.parse(localStorage.getItem('iaam_guest') || 'null');
        let isAdminLoggedIn = localStorage.getItem('iaam_admin') === 'true';
        let isMusicPlaying = false;

        let eventConfig = {
            organization_name: 'IAAM — Ikatan Alumni Al-Falahul Makkiyah Majidiyah',
            event_name: 'MAULIDURROSUL ﷺ',
            theme: 'Meneladani Akhlak Rasulullah ﷺ, Mempererat Ukhuwah Alumni dan Keluarga Besar Al-Falahul Makkiyah Majidiyah',
            event_date: '2026-10-15',
            event_time: '19:30',

            address: 'Jl. Pesantren Al-Falah No. 10, Majidiyah, Madura, Jawa Timur',
            maps_url: 'https://maps.google.com',
            description: 'Acara agung peringatan Maulid Nabi Muhammad SAW.',
            logo_text: 'LOGO IAAM',
            logo_url: ''
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-800 border border-gold-500/50' : 'bg-red-700'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-gold-500' : 'fa-circle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function router() {
            const hash = window.location.hash.slice(1) || '/';
            currentRoute = hash;
            const appDiv = document.getElementById('app');
            const floatingActions = document.getElementById('floating-actions');

            if (currentRoute.startsWith('/admin') && currentRoute !== '/admin/login' && !isAdminLoggedIn) {
                window.location.hash = '/admin/login';
                return;
            }

            if (currentRoute === '/undangan' && !currentUserData) {
                window.location.hash = '/';
                return;
            }

            if (currentRoute === '/undangan' || currentRoute.startsWith('/admin')) {
                floatingActions.classList.remove('hidden');
            } else {
                floatingActions.classList.add('hidden');
            }

            if (currentRoute === '/') renderCheckInForm(appDiv);
            else if (currentRoute === '/undangan') renderUndanganPage(appDiv);
            else if (currentRoute === '/admin/login') renderAdminLogin(appDiv);
            else if (currentRoute === '/admin') renderAdminDashboard(appDiv);
            else if (currentRoute === '/admin/tamu') renderAdminGuests(appDiv);
            else if (currentRoute === '/admin/pengaturan') renderAdminSettings(appDiv);
            else if (currentRoute === '/admin/ucapan') renderAdminGreetings(appDiv);
            else appDiv.innerHTML = `<div class="p-10 text-center"><h1 class="text-2xl font-bold text-emerald-900">404 Halaman Tidak Ditemukan</h1><a href="#/" class="text-emerald-700 underline mt-4 inline-block">Kembali ke Beranda</a></div>`;
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', () => {
            if (!window.location.hash) window.location.hash = '/';
            router();
        });

        function renderCheckInForm(container) {
            container.innerHTML = `
                <div class="min-h-screen bg-islamic-pattern py-12 px-4 flex items-center justify-center relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-b from-emerald-950/90 via-emerald-900/80 to-emerald-950/95 pointer-events-none"></div>
                    <div class="max-w-md w-full bg-[#fcfbf7] rounded-3xl shadow-2xl p-6 sm:p-8 relative z-10 border-2 border-gold-500/40">
                        <div class="text-center mb-6">
                            <div class="w-20 h-20 mx-auto bg-emerald-900 rounded-full flex items-center justify-center border-2 border-gold-500 shadow-inner mb-3 text-gold-500 font-bold text-xs uppercase p-2">
                                ${eventConfig.logo_text}
                            </div>
                            <span class="text-xs uppercase tracking-widest text-gold-600 font-semibold">Undangan Resmi</span>
                            <h1 class="text-2xl sm:text-3xl font-bold text-emerald-950 font-amiri mt-1">MAULIDURROSUL ﷺ</h1>
                            <p class="text-xs text-emerald-800 font-medium mt-1">IAAM — Ikatan Alumni Al-Falahul Makkiyah Majidiyah</p>
                        </div>
                        <div class="bg-emerald-50 border-l-4 border-gold-500 p-3.5 rounded-r-xl mb-6 text-xs text-emerald-900 leading-relaxed">
                            <p class="font-semibold mb-1">Assalamu'alaikum Warahmatullahi Wabarakatuh.</p>
                            Sebelum membuka undangan, mohon isi data diri dan konfirmasi kehadiran terlebih dahulu.
                        </div>
                        <form onsubmit="handleCheckInSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">Nama Lengkap *</label>
                                <input type="text" id="guest-name" required placeholder="Masukkan nama lengkap" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">Nomor WhatsApp *</label>
                                <input type="tel" id="guest-phone" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">Konfirmasi Kehadiran *</label>
                                <select id="guest-attendance" required class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white">
                                    <option value="" disabled selected>Pilih Status Kehadiran</option>
                                    <option value="hadir">Hadir</option>
                                    <option value="tidak_hadir">Tidak Hadir</option>
                                    <option value="tentatif">Masih Tentatif</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">Jumlah Tamu</label>
                                <div class="flex items-center border border-slate-300 rounded-xl overflow-hidden bg-white">
                                    <button type="button" onclick="adjustCount(-1)" class="px-4 py-3 bg-slate-100 text-slate-700 font-bold">-</button>
                                    <input type="number" id="guest-count" value="1" min="1" readonly class="w-full text-center py-2 font-bold text-slate-800">
                                    <button type="button" onclick="adjustCount(1)" class="px-4 py-3 bg-slate-100 text-slate-700 font-bold">+</button>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-emerald-800 hover:bg-emerald-900 text-gold-500 font-bold rounded-xl shadow-lg uppercase tracking-wider flex items-center justify-center gap-2 mt-2">
                                <i class="fa-solid fa-envelope-open-text"></i> BUKA UNDANGAN
                            </button>
                        </form>
                        <div class="mt-6 text-center">
                            <a href="#/admin/login" class="text-xs text-slate-500 hover:text-emerald-800 font-medium"><i class="fa-solid fa-lock mr-1"></i> Login Dashboard Panitia</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function adjustCount(val) {
            const input = document.getElementById('guest-count');
            let current = parseInt(input.value) + val;
            if (current < 1) current = 1;
            input.value = current;
        }

        function handleCheckInSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('guest-name').value.trim();
            const phone = document.getElementById('guest-phone').value.trim();
            const attendance_status = document.getElementById('guest-attendance').value;
            const guest_count = parseInt(document.getElementById('guest-count').value) || 1;

            currentUserData = { id: 'g_' + Date.now(), name, phone, attendance_status, guest_count, created_at: new Date().toISOString() };
            localStorage.setItem('iaam_guest', JSON.stringify(currentUserData));

            showToast('Data berhasil disimpan. Membuka undangan...');
            setTimeout(() => { window.location.hash = '/undangan'; }, 800);
        }

        function renderUndanganPage(container) {
            const guest = currentUserData || { name: 'Tamu Undangan', attendance_status: 'hadir', guest_count: 1 };
            container.innerHTML = `
                <header class="min-h-screen bg-islamic-pattern text-white flex flex-col items-center justify-between p-6 text-center relative overflow-hidden">

                    </div>
                    <div class="relative z-10 max-w-lg w-full my-auto py-6">

                        <p class="text-xs sm:text-sm font-semibold tracking-wider text-emerald-200 uppercase mb-6">${eventConfig.organization_name}</p>
                        <div class="bg-white/10 backdrop-blur-md border border-gold-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl">
                            <p class="text-sm text-slate-200 mb-4">Dengan penuh rasa syukur dan kebahagiaan, kami mengundang:</p>
                            <div class="py-3 px-6 bg-emerald-900/80 rounded-2xl border border-gold-500/50 inline-block mb-4">
                                <span class="text-xs text-gold-400 block uppercase">Kepada Yth.</span>
                                <h3 class="text-xl sm:text-2xl font-bold text-white font-amiri mt-0.5">${guest.name}</h3>
                            </div>
                            <p class="text-xs sm:text-sm text-slate-200">Untuk menghadiri acara Maulidurrosul ﷺ.</p>
                        </div>
                    </div>
                    <div class="relative z-10 pb-6">

                            <span>Scroll untuk Membuka</span>
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </a>
                    </div>
                </header>
                <section id="detail-acara" class="py-16 px-4 bg-ivory-pattern text-slate-800 text-center">
                    <div class="max-w-2xl mx-auto">
                        <h2 class="text-3xl font-bold font-amiri text-emerald-950 mb-4">Waktu & Tempat</h2>
                        <div class="bg-white p-6 rounded-3xl shadow-xl border border-emerald-100 mb-6 text-left">
                            <p class="font-bold text-emerald-950 text-base">${eventConfig.venue}</p>
                            <p class="text-xs text-slate-600 mt-1">${eventConfig.address}</p>
                        </div>
                    </div>
                </section>
                <footer class="bg-emerald-950 text-white py-12 px-4 text-center border-t-2 border-gold-500/40">
                    <p class="font-amiri text-base text-gold-400 mb-2">Wassalamu'alaikum Warahmatullahi Wabarakatuh</p>
                    <p class="text-xs text-slate-500">© 2026 IAAM</p>
                </footer>
            `;
        }

        function renderAdminLogin(container) {
            container.innerHTML = `
                <div class="min-h-screen bg-islamic-pattern flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border-t-4 border-gold-500 text-center">
                        <h2 class="text-2xl font-bold font-amiri text-emerald-950 mb-1">Login Admin IAAM</h2>
                        <p class="text-xs text-slate-500 mb-6">Gunakan admin@iaam.org / admin123</p>
                        <form onsubmit="handleAdminLoginSubmit(event)" class="space-y-4 text-left">
                            <input type="email" id="admin-email" value="admin@iaam.org" required class="w-full px-4 py-3 border rounded-xl text-xs">
                            <input type="password" id="admin-pass" value="admin123" required class="w-full px-4 py-3 border rounded-xl text-xs">
                            <button type="submit" class="w-full py-3.5 bg-emerald-800 text-gold-500 font-bold rounded-xl uppercase tracking-wider text-xs">MASUK</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleAdminLoginSubmit(e) {
            e.preventDefault();
            isAdminLoggedIn = true;
            localStorage.setItem('iaam_admin', 'true');
            showToast('Login berhasil!');
            window.location.hash = '/admin';
        }

        function renderAdminDashboard(container) {
            container.innerHTML = `
                <div class="p-8 max-w-4xl mx-auto text-center">
                    <h1 class="text-3xl font-bold font-amiri text-emerald-950 mb-4">Dashboard Admin IAAM</h1>
                    <p class="text-sm text-slate-600 mb-6">Selamat datang di panel pengelolaan undangan digital.</p>
                    <a href="#/" class="px-6 py-3 bg-emerald-800 text-gold-500 font-bold rounded-xl inline-block text-xs uppercase">Kembali ke Beranda</a>
                </div>
            `;
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            if (isMusicPlaying) { audio.pause(); isMusicPlaying = false; showToast('Musik dijeda'); }
            else { audio.play().then(() => { isMusicPlaying = true; showToast('Memutar musik'); }).catch(() => {}); }
        }

        function shareInvitation() {
            const text = `Assalamu'alaikum. Mari hadir di acara Maulidurrosul ﷺ IAAM.`;
            if (navigator.share) navigator.share({ title: 'Undangan IAAM', text }).catch(() => {});
            else { navigator.clipboard.writeText(text); showToast('Link disalin ke clipboard.'); }
        }
    </script>
</body>
</html>
